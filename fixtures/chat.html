<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>imeplay — 연습용 목(mock) 채팅</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; margin: 0; background: #f4f5f7; }
  header { background: #263238; color: #fff; padding: 10px 16px; font-size: 14px; }
  header b { color: #ffd54f; }
  #mode { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: #455a64; }
  #code { margin: 8px 16px 0; font: 12px ui-monospace, Menlo, monospace; color: #455a64; }
  #messages { list-style: none; margin: 0; padding: 12px 16px; min-height: 180px; }
  .msg { max-width: 70%; margin: 6px 0; padding: 8px 12px; border-radius: 14px; font-size: 15px; white-space: pre-wrap; }
  .msg.user { margin-left: auto; background: #1976d2; color: #fff; width: fit-content; }
  .msg.bot { background: #fff; color: #263238; width: fit-content; border: 1px solid #dde1e6; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #dde1e6; background: #fff; }
  textarea { flex: 1; font: inherit; font-size: 15px; padding: 8px; resize: none; }
</style>
</head>
<body>
<!-- 연습용 목(mock) 채팅 화면이다. 실제 서비스가 아니며, 응답은 로컬 서버나 imeplay 의 가짜 응답이 돌려준다. -->
<header>연습용 목(mock) 채팅 화면 · 실제 서비스가 아님 · Enter 핸들러: <b id="mode"></b></header>
<pre id="code"></pre>
<ul id="messages"></ul>
<form id="form" onsubmit="return false">
  <textarea id="prompt" rows="2" placeholder="메시지를 입력하고 Enter (줄바꿈은 Shift+Enter)" autofocus></textarea>
</form>
<script>
  // ?mode=buggy | composing-only | fixed — 실제 앱에서 흔한 세 가지 Enter 핸들러
  const mode = new URLSearchParams(location.search).get('mode') || 'fixed';
  const CODE = {
    'buggy': "if (e.key === 'Enter' && !e.shiftKey) send();  // 조합 검사 없음",
    'composing-only': "if (e.isComposing) return;  // Safari 에서는 부족함\nif (e.key === 'Enter' && !e.shiftKey) send();",
    'fixed': "if (e.isComposing || e.keyCode === 229) return;  // 권장\nif (e.key === 'Enter' && !e.shiftKey) send();",
  };
  document.getElementById('mode').textContent = mode;
  document.getElementById('code').textContent = CODE[mode] || '(unknown mode)';

  const prompt = document.getElementById('prompt');
  const list = document.getElementById('messages');

  function bubble(who, text) {
    const li = document.createElement('li');
    li.className = 'msg ' + who;
    li.textContent = text;
    list.appendChild(li);
  }

  async function send() {
    const text = prompt.value;
    if (text.trim() === '') return; // 빈 메시지는 보내지 않는다
    prompt.value = '';
    bubble('user', text);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      bubble('bot', data.reply);
    } catch (err) {
      bubble('bot', '(mock) 응답 실패: ' + err);
    }
  }

  prompt.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    if (mode === 'composing-only' && e.isComposing) return;
    if (mode === 'fixed' && (e.isComposing || e.keyCode === 229)) return;
    e.preventDefault();
    send();
  });
</script>
</body>
</html>
